# Rebuilds the front page and publishes the whole repo to GitHub Pages
# on every push to main. Play at https://pablokm.github.io/ISLANAUT/
#
# Publishes two ways so the site works whichever Pages source is set:
#  1. pushes the built site to the `gh-pages` branch (Settings → Pages → Deploy from a branch → gh-pages / root).
#     GitHub normally switches Pages on by itself the first time this branch appears.
#  2. deploys through GitHub Actions (Settings → Pages → Source: GitHub Actions). Skipped quietly if not set up.
name: Publish games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build front page
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          node scripts/build-index.mjs --out _site
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
        continue-on-error: true
